.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 50%,rgba(255,240,245,.06),rgba(240,220,228,.22));}
#ambient{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%;}

/* ---------- loader ---------- */
.loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;cursor:pointer;
  background:rgba(250,236,241,.16);
  transition:opacity 1.1s ease, visibility 1.1s;}
.loader canvas{position:absolute;inset:0;width:100%;height:100%;}
.loader .lbl{position:relative;text-align:center;color:#fff;text-shadow:0 1px 14px rgba(160,60,100,.55);}
.loader .lbl b{display:block;font-family:var(--script);font-weight:400;font-size:clamp(46px,13vw,76px);line-height:.9;}
.loader .lbl span{display:block;margin-top:10px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;font-variant-numeric:tabular-nums;}
.loader .skip{display:block;margin-top:26px;font-size:11px;letter-spacing:.2em;opacity:.85;}
body.open .loader{opacity:0;visibility:hidden;}

/* ---------- stage & card ---------- */
.stage{position:relative;z-index:5;height:100%;display:grid;place-items:center;}
.wrap{position:relative;width:min(100%,470px,calc((100dvh - 36px) * .7966));aspect-ratio:556/698;max-width:100%;
  opacity:0;transform:translateY(24px) scale(.92);filter:blur(8px);
  transition:opacity 1.2s ease .35s,transform 1.4s cubic-bezier(.2,.8,.2,1) .35s,filter 1.2s ease .35s;}
body.open .wrap{opacity:1;transform:none;filter:none;}

.float,.spin,.twinkle{will-change:transform;}
body.offcard .stage *,body.baking .stage *,body.baking .wish *{animation-play-state:paused!important;}
.comp{position:absolute;left:11.2%;top:4.2%;width:77.6%;aspect-ratio:9/16;container-type:inline-size;}
.abs{position:absolute;}
.pop{opacity:0;transform:scale(.4) rotate(var(--r,0deg));transition:opacity .5s ease,transform .8s cubic-bezier(.3,1.6,.5,1);}
body.open .pop{opacity:1;transform:scale(1) rotate(var(--r,0deg));transition-delay:var(--d,1s);}
.float{animation:bob var(--t,5s) ease-in-out infinite;animation-delay:var(--o,0s);}
@keyframes bob{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -6%;rotate:var(--sw,4deg)}}
.spin{animation:spin var(--t,14s) linear infinite;}
@keyframes spin{to{rotate:360deg}}
.twinkle{animation:tw 2.4s ease-in-out infinite;animation-delay:var(--o,0s);}
@keyframes tw{0%,100%{opacity:1;scale:1}50%{opacity:.45;scale:.75}}
svg{display:block;overflow:visible;}

/* card composition */
.photo{left:18%;top:23%;width:64%;cursor:pointer;z-index:3;}
.photo img{display:block;width:100%;transition:filter .8s ease;
  
  filter:drop-shadow(0 4px 8px rgba(60,30,40,.16));}
.photo.color img{filter:grayscale(1) contrast(1.1) brightness(1.05) drop-shadow(0 4px 8px rgba(60,30,40,.16));}
.hat{left:23%;top:-20%;width:27%;--r:8deg;z-index:4;}
.hat svg{animation:bob 4.6s ease-in-out infinite;--sw:-3deg;}

/* foil balloon type */
.foil{display:inline-block;position:relative;font-family:"Fredoka","Bagel Fat One",system-ui,sans-serif;font-weight:700;line-height:1;
  background:linear-gradient(170deg,#ffe0ea 0%,#f4a6c0 28%,#ec8fb1 50%,#f7b9cf 66%,#d9709a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:.35cqw #e48aaa;paint-order:stroke fill;
  filter:drop-shadow(0 .5cqw .5cqw rgba(170,70,110,.35));}
.foil::after{content:attr(data-c);position:absolute;inset:0;
  background:linear-gradient(150deg,rgba(255,255,255,.95) 0 18%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 70%,rgba(255,255,255,.55) 80%,rgba(255,255,255,0) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;}
.age{right:6%;top:19.5%;z-index:6;font-size:27cqw;letter-spacing:-.02em;--r:-6deg;}
.age .foil{-webkit-text-stroke:.45cqw #e27fa4;}
.words{left:0;right:0;z-index:7;display:flex;justify-content:center;}
.words .foil{font-size:14.5cqw;margin:0 -.3cqw;}
.happy{top:62.5%;padding-left:6%;}
.bday{top:70.8%;}

/* halo stickers (around the card) */
.halo{z-index:2;}
@media (max-width:560px){ .halo.wide{display:none;} }
@media (min-width:561px){ .halo.mob{display:none;} }

/* burst confetti */
.bit{position:fixed;z-index:40;pointer-events:none;width:18px;height:18px;left:0;top:0;}

@media (prefers-reduced-motion:reduce){
  .float,.spin,.twinkle,.hat svg,.age{animation:none!important;}
  .wrap,.pop{transition-duration:.01s!important;transition-delay:0s!important;}
}

[hidden]{display:none!important;}

<script>

/* heart balloons: buoyant bodies on taut strings tied at one point */
(function(){
  const svg=document.getElementById('hb');if(!svg)return;
  const A={x:62,y:166},S=.54,KX=50*S,KY=94*S;
  const B=[{L:86,a0:-.46,ph:0},{L:110,a0:-.04,ph:2.1},{L:80,a0:.4,ph:4.2}].map(b=>({...b,a:b.a0,v:0,tilt:0}));
  const strs=svg.querySelectorAll('#hbStr path'),bals=svg.querySelectorAll('#hbBal > g');
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function place(){
    B.forEach((b,i)=>{
      const kx=A.x+b.L*Math.sin(b.a),ky=A.y-b.L*Math.cos(b.a);
      // string: nearly straight under tension, bowing slightly against the swing
      const mx=(A.x+kx)/2-b.v*38*Math.cos(b.a),my=(A.y+ky)/2-b.v*38*Math.sin(b.a);
      strs[i].setAttribute('d',`M${A.x} ${A.y}Q${mx.toFixed(2)} ${my.toFixed(2)} ${kx.toFixed(2)} ${ky.toFixed(2)}`);
      // the knot sits on the string end and the balloon lines up with the string, lagging a little
      const deg=(b.a+b.tilt)*180/Math.PI;
      bals[i].setAttribute('transform',`translate(${kx.toFixed(2)} ${ky.toFixed(2)}) rotate(${deg.toFixed(2)}) translate(${-KX} ${-KY}) scale(${S})`);
    });
  }
  place();
  if(still)return;
  let last=performance.now();
  function step(t){
    const bc=document.body.classList;
    if(document.hidden||bc.contains('offcard')||bc.contains('baking')){last=t;requestAnimationFrame(step);return;}
    const dt=Math.min(.05,(t-last)/1000);last=t;const s=t/1000;
    B.forEach((b,i)=>{
      // buoyancy pulls each string back toward its rest angle; a soft breeze pushes it around
      const wind=.55*Math.sin(s*.7+b.ph)+.3*Math.sin(s*1.9+b.ph*1.7)+.18*Math.sin(s*3.3+i);
      let acc=-3.2*(b.a-b.a0)-1.6*b.v+wind*.9;
      // neighbouring balloons nudge each other apart instead of passing through
      B.forEach((o,j)=>{if(i===j)return;const d=b.a-o.a,gap=.36;if(Math.abs(d)<gap)acc+=Math.sign(d||1)*(gap-Math.abs(d))*14;});
      b.v+=acc*dt;b.a+=b.v*dt;
      b.tilt+=(-b.v*.9-b.tilt)*Math.min(1,dt*4);
    });
    place();requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
/* flatten the die-cut stickers into plain images once, so their filters are not re-run while they float */
(function(){
  const lib=document.querySelector('svg defs');if(!lib)return;
  const defs=lib.outerHTML;
  document.querySelectorAll('.halo svg').forEach(s=>{
    if(!s.querySelector('[filter]'))return;
    const vb=s.getAttribute('viewBox'),cls=s.getAttribute('class')||'',st=s.getAttribute('style')||'';
    const src=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="${vb}" width="240" height="${Math.round(240*vb.split(' ')[3]/vb.split(' ')[2])}" overflow="visible">${defs}${s.innerHTML}</svg>`;
    const img=new Image();img.alt='';img.decoding='async';img.className=cls;img.setAttribute('style',st+';display:block;width:100%;height:auto;overflow:visible');
    const v=new Image();
    v.onload=()=>{try{const c=document.createElement('canvas');c.width=v.width;c.height=v.height;c.getContext('2d').drawImage(v,0,0);
      c.toBlob(bl=>{if(!bl)return;img.onload=()=>s.replaceWith(img);img.src=URL.createObjectURL(bl);},'image/png');}catch(e){}};
    v.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src);
  });
})();
/* pause the card's motion while it is off screen */
(function(){const st=document.querySelector('.stage');if(!st||!('IntersectionObserver' in window))return;
  new IntersectionObserver(es=>es.forEach(e=>document.body.classList.toggle('offcard',e.intersectionRatio<.05)),{threshold:[0,.05,.1]}).observe(st);})();
/* foil balloon letters */
function foilWord(id, word, arc){
  const el=document.getElementById(id); const n=word.length;
  [...word].forEach((ch,i)=>{
    const s=document.createElement('span'); s.className='pop'; s.setAttribute('aria-hidden','true');
    const mid=(n-1)/2, k=(i-mid)/mid, rot=k*arc + ((i*37)%7-3)*.8, dy=(k*k)*arc*.25 + ((i*17)%5-2)*.6;
    s.style.cssText=`display:inline-block;--d:${(1.2+i*.06).toFixed(2)}s;--r:${rot.toFixed(1)}deg;translate:0 ${dy.toFixed(1)}%`;
    s.innerHTML=`<span class="float" style="display:inline-block;--t:${(4.4+(i%3)*.7).toFixed(1)}s;--o:${(-i*.4).toFixed(1)}s;--sw:${i%2?2:-2}deg"><span class="foil" data-c="${ch}">${ch}</span></span>`;
    el.appendChild(s);
  });
}
foilWord('happy','HAPPY',10);
foilWord('bday','BIRTHDAY',14);


/* falling lilies */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* pastel confetti: curly ribbons, spirals, dashes, dots */
const CONF_COLORS=['#f17fb0','#ff8a4c','#f9c846','#9cc47c','#9ec3f2','#c3b1e9','#f6a5c9','#f47c7c'];
const CONF_KINDS=['spiral','coil','wave','curl','dash','dot','chev'];
function confSprite(kind,col){
  const S=96,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  g.strokeStyle=col;g.fillStyle=col;g.lineWidth=kind==='dash'?9:6.5;g.lineCap='round';g.lineJoin='round';g.translate(S/2,S/2);g.beginPath();
  const pl=fn=>{let first=true;fn((x,y)=>{if(first){g.moveTo(x,y);first=false;}else g.lineTo(x,y);});g.stroke();};

    if(g.pt)body+=pipes(ring(g.P,g.R*.97,g.yt,10),g.pt,5.2);
  });
  // decor: projected for the current camera; candles go on last so the message sits under them
  const BASE={K:K0,hs:1},Gb=o.view?withView(BASE,()=>geom(c)):null,n=c.d.length,late=[];
  const put=(d,i)=>{let x=d.x,y=d.y;if(Gb){const p=withView(BASE,()=>to3D(d,Gb));x=CX+p.u;y=YB0-p.z*HSC+p.v*K;}return decorSvg(d,o.fresh&&i===n-1,x,y);};

  const over=d=>{if(!mb)return false;let x=d.x,y=d.y;if(Gb){const p=withView(BASE,()=>to3D(d,Gb));x=CX+p.u;y=YB0-p.z*HSC+p.v*K;}const lift=(d.t==='candle'||d.t==='num20')?18:6;return Math.abs(x-mb.x)<mb.w&&y>mb.y-mb.h&&y-lift<mb.y+mb.h;};
  c.d.forEach((d,i)=>{if(d.t==='candle'||d.t==='num20'||over(d))late.push([d,i]);else body+=put(d,i);});
  if(G.length&&c.msg&&c.msg.trim()){
    const gt=G[G.length-1],L=msgLayout(gt,c.msg);
    let s=`<g class="cmsg"><g transform="translate(${CX} ${f(gt.yt+L.oy*K)}) scale(1 ${K.toFixed(3)})">`;
    L.lines.forEach((ln,i)=>{const y=L.y0+i*L.lh;
      defs+=`<clipPath id="${id}mc${i}"><rect id="${id}mr${i}" x="${f(-L.W-12)}" y="${f(y-L.fs*1.25)}" width="${o.reveal?0:f(2*L.W+24)}" height="${f(L.fs*1.9)}"/></clipPath>`;
      s+=`<text id="${id}mt${i}" clip-path="url(#${id}mc${i})" x="0" y="${f(y)}" data-maxw="${f(2*L.W)}" font-family="'Moon Dance','Dancing Script',cursive" font-size="${f(L.fs)}" fill="${c.mc}" stroke="${c.mc}" stroke-width="${f(L.fs*.05)}" stroke-linejoin="round" text-anchor="middle" filter="url(#icing)">${esc(ln)}</text>`;});
    body+=s+'</g></g>';
  }
  late.forEach(([d,i])=>{const h=put(d,i);body+=mb&&over(d)?`<g opacity=".5">${h}</g>`:h;});
  const vb=o.vb?o.vb.map(v=>v.toFixed(1)).join(' '):'0 40 400 400';
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(o.label||'Bánh kem')}"><defs>${defs}</defs>${body}${o.bag?'<g id="'+id+'bag" style="display:none"><use href="#pbag"/></g>':''}</svg>`;
}

/* ---------- sanitize shared data ---------- */
function clean(o){
  if(!o||typeof o!=='object')return null;
  const tiers=(Array.isArray(o.tiers)?o.tiers:[]).slice(0,3).filter(t=>t&&SHAPE_NAME[t.s]).map(t=>({s:t.s,c:HEX.test(t.c)?t.c:'#f9d5df',bow:HEX.test(t.bow)?t.bow:null,pt:HEX.test(t.pt)?t.pt:null,pb:HEX.test(t.pb)?t.pb:null}));
  if(!tiers.length)return null;
  const d=(Array.isArray(o.d)?o.d:[]).slice(0,MAXD).filter(x=>x&&DT.has(x.t)&&isFinite(x.x)&&isFinite(x.y)).map(x=>({t:x.t,x:clamp(+x.x,0,400),y:clamp(+x.y,40,440),r:clamp(+x.r||0,-180,180),s:clamp(+x.s||1,.4,2),c:x.t.startsWith('gem')?clamp(x.c|0,0,5):(HEX.test(x.c)?x.c:null),...(x.k?{k:1}:{})}));
  return {tiers,d,msg:[...String(o.msg||'')].slice(0,MAXMSG).join(''),mc:HEX.test(o.mc)?o.mc:'#5b3a33',from:[...String(o.from||'')].slice(0,24).join(''),at:+o.at||0};
}

/* ---------- random cakes for the loading rain ---------- */
function randomCake(){
  const n=1+Math.floor(Math.random()*3),tiers=[];
  for(let i=0;i<n;i++)tiers.push({s:pick(SHAPES)[0],c:pick(CREAM)[0],bow:Math.random()<.35?pick(RIBBON)[0]:null,pt:Math.random()<.6?pick(PIPE)[0]:null,pb:Math.random()<.5?pick(PIPE)[0]:null});
  const c={tiers,d:[],msg:'',mc:'#5b3a33'};const G=geom(c),top=G[G.length-1];
  const fr=pick(['strawberry','cherry','raspberry','blueberry']);
  for(let i=0;i<5;i++){const a=i/5*Math.PI*2;c.d.push({t:fr,x:CX+Math.cos(a)*top.R*.5,y:top.yt+Math.sin(a)*top.R*K*.5,r:rnd(-20,20),s:1});}
  c.d.sort((a,b)=>a.y-b.y);
  if(Math.random()<.6)c.d.push({t:'candle',x:CX,y:top.yt+2,r:0,s:1,c:pick(CANDLE)[0]});
  return c;
}

function vbFor(e,ck=cake){

}
function animateCam(target,ms,done){

}

function evenGems(G){
  const out=[],gem=(x,y)=>out.push({t:pick(GEMS),x:x+rnd(-1.5,1.5),y:y+rnd(-1.2,1.2),r:rnd(-35,35),s:rnd(.78,1.02),c:Math.floor(Math.random()*6),k:1});
  G.forEach((g,i)=>{
    const n=G[i+1],step=20+g.R*.05;
    // side: staggered rows around the visible front
    const rows=g.H>=60?[.24,.52,.8]:[.3,.7];
    rows.forEach((fr,ri)=>{
      const cy=g.yb-g.H*fr;
      let pts=ring(g.P,g.R*1.005,cy,step);
      if(ri%2)pts=pts.map((p,j)=>{const q=pts[(j+1)%pts.length];return [(p[0]+q[0])/2,(p[1]+q[1])/2];});
      pts.forEach(([x,y])=>{
        if(y<=cy+g.R*K*.1)return;               // back half / silhouette
        if(n&&fr>.7&&inPoly(n.P,n.R*1.05,n.yb,x,y))return;
        gem(x,y);
      });
    });
    // top: staggered grid inside the top surface, skipping where the next tier sits
    const sx=30,sy=30*K*1.15;let row=0;
    for(let y=g.yt-g.R*K;y<=g.yt+g.R*K;y+=sy,row++){
      for(let x=CX-g.R+(row%2?sx/2:0);x<=CX+g.R;x+=sx){
        if(!inPoly(g.P,g.R*.8,g.yt,x,y))continue;
        if(n&&inPoly(n.P,n.R*1.12,n.yb,x,y))continue;
        gem(x,y);
      }
    }
  });
  return out;
}
function frontAt(P,R,x){
  const ux=(x-CX)/R;let m=null;
  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];
    if((a[0]-ux)*(b[0]-ux)<=0&&a[0]!==b[0]){const y=a[1]+(b[1]-a[1])*(ux-a[0])/(b[0]-a[0]);if(m===null||y>m)m=y;}}
  return m===null?null:m*R*K;
}
function hiddenByUpper(G,i,x,y){
  for(let j=i+1;j<G.length;j++){const g=G[j];for(let t=0;t<=g.H;t+=3)if(inPoly(g.P,g.R*1.06,g.yb-t,x,y))return true;}
  return false;
}
function surfacePts(G,s,jit){
  const out=[];
  G.forEach((g,i)=>{
    // top surface: hex grid laid out in real (unflattened) space, then flattened
    for(let v=-g.R,row=0;v<=g.R;v+=s*.866,row++){
      for(let u=-g.R+(row%2?s/2:0);u<=g.R;u+=s){
        const x=CX+u+rnd(-jit,jit)*s,y=g.yt+(v+rnd(-jit,jit)*s)*K;
        if(inPoly(g.P,g.R*.86,g.yt,x,y)&&!hiddenByUpper(G,i,x,y))out.push([x,y]);
      }
    }
    // visible side: even columns across the front, staggered rows
    const lo=g.bow?20:8,hi=g.H-8,rows=Math.max(1,Math.round((hi-lo)/(s*.8))+1);
    for(let r=0;r<rows;r++){
      const h=rows===1?(lo+hi)/2:lo+(hi-lo)*r/(rows-1);
      for(let u=-g.R*.9+(r%2?s/2:0);u<=g.R*.9;u+=s){
        const x=CX+u+rnd(-jit,jit)*s*.5,fy=frontAt(g.P,g.R,x);
        if(fy===null)continue;
        out.push([x,g.yb-h+fy+rnd(-jit,jit)*s*.4]);
      }
    }
  });
  return out.sort((a,b)=>a[1]-b[1]);
}
function scatter(kind){
  const G=geom(cake);if(!G.length)return;snap();
  const tag=kind==='gems'?'gem':'spr';
  cake.d=cake.d.filter(d=>d.sc!==tag);
  surfacePts(G,kind==='gems'?44:27,.22).forEach(([x,y])=>{
    if(cake.d.length>=MAXD)return;
    cake.d.push(kind==='gems'?{t:pick(GEMS),x,y,r:rnd(-40,40),s:rnd(.72,1),c:Math.floor(Math.random()*6),sc:tag}:{t:'sprinkle',x,y,r:rnd(-90,90),s:rnd(.8,1.05),c:pick(SPRINK),sc:tag});
  });
  draw();
}

/* step 4: candles step back to the rear third of the top so the message has room */
function candlesBack(){
  const G=withView({K:K0,hs:1},()=>geom(cake));if(!G.length)return;
  const gt=G[G.length-1];
  withView({K:K0,hs:1},()=>{
    cake.d.forEach(d=>{
      if(d.t!=='candle'&&d.t!=='num20')return;
      if(!inPoly(gt.P,gt.R*1.02,gt.yt,d.x,d.y))return;
      const vy=(d.y-gt.yt)/(gt.R*K0);if(vy<=-.45)return;
      let u=d.x-CX,ny=-.62+clamp(vy,-1,1)*.08,tries=0;
      while(!inPoly(gt.P,gt.R*.82,gt.yt,CX+u,gt.yt+ny*gt.R*K0)&&tries++<12){u*=.85;ny+=.02;}
      d.x=CX+u;d.y=gt.yt+ny*gt.R*K0;
    });
  });
}

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function writeMsg(){
  cake.msg=cake.msg.trim();if(!cake.msg||writing)return;
  writing=true;written=false;sent=false;renderPanel();
  panel.querySelectorAll('button,input').forEach(b=>b.disabled=true);
  const go=()=>{
    draw({reveal:true});
    const G=withView(viewFor(camE),()=>geom(cake)),gt=G[G.length-1],L=msgLayout(gt,cake.msg),Kv=viewFor(camE).K,bag=box.querySelector('#mbag');
    const lines=L.lines.map((ln,i)=>{const t=box.querySelector('#mmt'+i),r=box.querySelector('#mmr'+i);let w=2*L.W;try{w=t.getComputedTextLength();}catch(e){}const fs=parseFloat(t.getAttribute('font-size'));return {r,w,fs,y:L.y0+i*L.lh,n:[...ln].length};});
    lines.forEach(l=>{l.r.setAttribute('x',(-l.w/2-8).toFixed(1));});
    const total=lines.reduce((s,l)=>s+l.n,0),dur=reduce?10:Math.max(1900,Math.min(total*150,6000+total*40)),t0=performance.now();
    bag.style.display='';
    function fr(t){
      let p=clamp((t-t0)/dur,0,1),acc=0,cur=lines[lines.length-1],lp=1;
      for(const l of lines){const share=l.n/total;if(p<=acc+share+1e-9){cur=l;lp=(p-acc)/share;break;}acc+=share;}
      lines.forEach(l=>{const w=l===cur?lp:(lines.indexOf(l)<lines.indexOf(cur)?1:0);l.r.setAttribute('width',((l.w+16)*w).toFixed(1));});
      const px=-cur.w/2+cur.w*lp,py=cur.y-cur.fs*.3+Math.sin(lp*cur.n*Math.PI*1.3)*cur.fs*.22;
      bag.setAttribute('transform',`translate(${(CX+px).toFixed(1)} ${(gt.yt+(L.oy+py)*Kv).toFixed(1)})`);
      if(p<1)requestAnimationFrame(fr);else{bag.style.display='none';writing=false;written=true;renderPanel();toast('Xong rồi! Gửi bánh cho '+NAME+' nhé');}
    }
    requestAnimationFrame(fr);
  };
  if(camE<ETOP-.5)animateCam(ETOP,900,go);else go();
}

});
$('vClose').addEventListener('click',closeBox);
$('viewer').addEventListener('click',e=>{if(e.target.id==='viewer')closeBox();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('viewer').hidden){e.stopPropagation();closeBox();}},true);
function showGallery(){
  if(writing)return;
  $('gallery').hidden=false;panel.hidden=true;stepsNav();adminBar();
  if(apiMode){apiLoad();clearInterval(apiTimer);apiTimer=setInterval(()=>{if($('gallery').hidden||bk.hidden){clearInterval(apiTimer);return;}apiLoad();},20000);}
  $('steps').querySelectorAll('button').forEach(b=>b.classList.remove('on'));$('steps').querySelector('.gal')?.classList.add('on');
  renderGallery();
}
function hideGallery(){$('gallery').hidden=true;panel.hidden=false;}
$('bakeMore').addEventListener('click',()=>{fresh();hideGallery();draw();renderPanel();});
$('steps').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.go)hideGallery();},true);

/* ---------- open / close ---------- */
function rain(){
  const L=$('bkLoad');L.querySelectorAll('.fc').forEach(n=>n.remove());
  if(reduce)return;
  const n=innerWidth<600?14:24;
  for(let i=0;i<n;i++){
    const d=document.createElement('div');d.className='fc';
    const w=rnd(.16,.3)*Math.min(innerWidth,900);
    d.style.cssText=`left:${rnd(-8,92)}%;--w:${w}px;--t:${rnd(1.6,2.6)}s;--dl:${rnd(0,1.4)}s;--r0:${rnd(-30,30)}deg;--r1:${rnd(-90,90)}deg`;
    d.innerHTML=renderCake(randomCake(),'r'+i,{}).replace('viewBox="0 40 400 400"','viewBox="40 120 320 320"');
    L.appendChild(d);
  }
}
function openBakery(gallery){
  document.body.classList.add('baking');
  const L=$('bkLoad');L.hidden=false;L.classList.remove('out');rain();
  setTimeout(()=>{
    bk.hidden=false;
    if(gallery)showGallery();else{hideGallery();draw();renderPanel();}
    L.classList.add('out');setTimeout(()=>{L.hidden=true;},700);
  },reduce?300:2700);
}
function closeBakery(){if(writing)return;bk.hidden=true;document.body.classList.remove('baking');}
$('openBakery').addEventListener('click',()=>openBakery(false));
$('openGallery').addEventListener('click',()=>openBakery(true));
$('bkClose').addEventListener('click',closeBakery);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!bk.hidden)closeBakery();});

/* ---------- reveal "Bake a wish" on scroll ---------- */
const wish=$('wish');
if('IntersectionObserver' in window&&!reduce){
  const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){wish.classList.remove('pre');io.disconnect();}});},{threshold:.35});
  io.observe(wish);
}else wish.classList.remove('pre');
})();
</script>
